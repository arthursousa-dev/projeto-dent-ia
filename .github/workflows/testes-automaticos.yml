name: Pipeline QA Completo - Dent IA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  qualidade-e-seguranca:
    runs-on: ubuntu-latest

    # Sobe o banco PostgreSQL (PLpgSQL) na nuvem para o sistema funcionar
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dent_ia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (JavaScript e Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar PHP e Ferramentas (PHPCS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      # Instalação segura verificando se os arquivos existem para não dar erro
      - name: Instalar Dependências do Projeto
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi
          npm install eslint stylelint stylelint-config-standard axe-playwright --save-dev
          npx playwright install --with-deps chromium

      - name: Criar pasta para os relatórios
        run: mkdir -p relatorios-finais

      # 1. Teste Estático (PHPCS e ESLint)
      - name: Teste Estático (PHP e JavaScript)
        run: |
          echo "=== RELATÓRIO DE ANÁLISE ESTÁTICA ===" > relatorios-finais/relatorio-codigo.txt
          echo "--- PHP (PHPCS) ---" >> relatorios-finais/relatorio-codigo.txt
          phpcs . --extensions=php --standard=PSR12 | tee -a relatorios-finais/relatorio-codigo.txt || true
          echo "--- JavaScript (ESLint) ---" >> relatorios-finais/relatorio-codigo.txt
          npx eslint . --ext .js | tee -a relatorios-finais/relatorio-codigo.txt || true

      # 2. Iniciar Servidor PHP com conexão ao PostgreSQL
      - name: Iniciar Servidor PHP
        run: |
          php -S 127.0.0.1:8000 &
          sleep 4
        env:
          DB_HOST: '127.0.0.1'
          DB_PORT: '5432'
          DB_NAME: 'dent_ia_test'
          DB_USER: 'postgres'
          DB_PASS: 'secretpassword'

      # 3. Executar Testes Dinâmicos (Playwright)
      - name: Executar Testes Dinâmicos e Gerar Relatório HTML
        run: npx playwright test --reporter=html
        env:
          BASE_URL: 'http://127.0.0.1:8000'
          PLAYWRIGHT_HTML_REPORT: 'relatorios-finais/playwright-html'

      # 4. Guardar Pacote de Relatórios (Artifacts)
      - name: Guardar Pacote de Relatórios (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relatorio-QA-Dent-IA
          path: relatorios-finais/
          retention-days: 30

      - name: Exibir Resumo na Tela do GitHub
        if: always()
        run: |
          echo "# Resumo de Qualidade - Dent IA" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline executado com suporte a PHP, PostgreSQL e JavaScript!" >> $GITHUB_STEP_SUMMARY
