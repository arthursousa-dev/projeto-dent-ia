name: Pipeline de Testes do Projeto

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  testar-projeto:
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código do repositório
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configurar o PHP (Essencial para o PHPCS e backend)
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs, phpcbf

      # ==========================================
      # 1. TESTE ESTÉTICO (PHPCS)
      # ==========================================
      - name: Executar Teste Estético (PHPCS)
        run: |
          echo "A executar análise estática de código PHP..."
          # Ajuste os caminhos ou regras conforme o seu projeto
          phpcs --standard=PSR12 includes/ dono_faturamento.php || echo "Aviso: Foram detetados problemas de estilo."

      # ==========================================
      # 2. TESTES DINÂMICOS / UNITÁRIOS (PHPUnit - se aplicável)
      # ==========================================
      - name: Executar Testes em PHP (se existirem)
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit não configurado ou sem testes unitários nesta fase."
          fi
